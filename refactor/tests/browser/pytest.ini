[pytest]
# Run from the repository root:  pytest refactor/tests/browser
# (an ini file here makes this folder the rootdir for these tests: tests/conftest.py of the backend is not loaded)
timeout = 90
addopts = -p no:cacheprovider
markers =
    dirty_writes_expected: the test mutates the stored events on purpose (it checks the dirty-write detector itself); the strict check is skipped
