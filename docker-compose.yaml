version: '3.3'
services:
  # Labelbee Application Service
  web:
    build: .
    container_name: labelbee_app
    ports:
      - "${LABELBEE_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
    volumes:
      - /mnt/remote_storage_node:/app/data:ro

  # MySQL DB (Optional / Legacy)
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    expose:
      - "3306"
    ports:
      - "3306:3306"
